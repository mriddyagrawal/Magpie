name: Build

on:
  push:
    branches: [main, front-back]
  pull_request:
    branches: [main, front-back]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: frontend/src-tauri/target/release/bundle/nsis/*.exe

          - os: macos-14
            target: aarch64-apple-darwin
            artifact: frontend/src-tauri/target/release/bundle/dmg/*.dmg

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: frontend/src-tauri/target/release/bundle/dmg/*.dmg

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: |
              frontend/src-tauri/target/release/bundle/deb/*.deb
              frontend/src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      # ── Python / uv ────────────────────────────────────────────────────────
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps (includes pyinstaller)
        run: uv sync --group dev

      - name: Download Qdrant binary
        run: uv run python scripts/download_qdrant.py

      - name: Build Python sidecar
        run: uv run python scripts/build_sidecar.py

      # ── Node / pnpm ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install

      # ── Rust ───────────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      # ── Linux system deps (Tauri needs webkit2gtk) ─────────────────────────
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── macOS code signing (item 3) ────────────────────────────────────────
      # Skipped automatically if APPLE_CERTIFICATE secret is not set.
      # To enable: add APPLE_CERTIFICATE (base64 .p12) and
      # APPLE_CERTIFICATE_PASSWORD to GitHub repository secrets.
      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p temppassword build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temppassword build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k temppassword build.keychain
          rm certificate.p12

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build Tauri app
        working-directory: frontend
        run: pnpm tauri build
        env:
          # macOS signing — ignored if secrets not set
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ── Windows code signing (item 4) ──────────────────────────────────────
      # Skipped automatically if WINDOWS_CERTIFICATE secret is not set.
      # To enable: add WINDOWS_CERTIFICATE (base64 .pfx) and
      # WINDOWS_CERTIFICATE_PASSWORD to GitHub repository secrets.
      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $cert = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = "$env:RUNNER_TEMP\certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $cert)
          $installer = Get-ChildItem `
            "frontend/src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe"
          & $signtool sign /f $certPath `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            $installer.FullName
          Remove-Item $certPath

      # ── Upload ─────────────────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magpie-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn
