name: Build

# Trigger matrix:
#   - Push to main / front-back / UI: validates build compiles, uploads
#     artifacts for inspection. NO release created.
#   - Push of tag matching v* (e.g. v0.1.1): full release flow via
#     tauri-apps/tauri-action — builds, signs, generates latest.json,
#     creates a draft GitHub Release with .dmg/.AppImage/.exe attached.
#   - Pull request: same as branch push (compile validation only).
#   - Manual workflow_dispatch: also triggers the full release flow,
#     useful for testing the release pipeline without cutting a tag.
on:
  push:
    branches: [main, front-back, UI]
    tags: ['v*']
  pull_request:
    branches: [main, front-back, UI]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: frontend/src-tauri/target/release/bundle/nsis/*.exe

          - os: macos-14
            target: aarch64-apple-darwin
            artifact: frontend/src-tauri/target/release/bundle/dmg/*.dmg

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: frontend/src-tauri/target/release/bundle/dmg/*.dmg

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: |
              frontend/src-tauri/target/release/bundle/deb/*.deb
              frontend/src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      # ── Python / uv ────────────────────────────────────────────────────────
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps (includes pyinstaller)
        run: uv sync --group dev --group packaging

      - name: Download Qdrant binary
        run: uv run python scripts/download_qdrant.py

      - name: Build Python sidecar
        run: uv run python scripts/build_sidecar.py

      # ── Node / pnpm ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install

      # ── Rust ───────────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      # ── Linux system deps (Tauri needs webkit2gtk) ─────────────────────────
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Branch / PR builds: just compile, no release ──────────────────────
      # `pnpm tauri build` directly. Validates compilation across all four
      # platforms in the matrix. Artifacts uploaded below for download.
      - name: Build Tauri app (compile-only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        working-directory: frontend
        run: pnpm tauri build
        env:
          # Apple notarization vars — passed through but no-ops if secrets unset.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Auto-updater signing key — only used if you've added the secret.
          # Without it, builds still succeed; updater just won't sign artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Tag / dispatch builds: full release flow via tauri-action ─────────
      # Replaces the previous custom "Import Apple cert" → "Build" → "Sign
      # Windows installer" → "Upload" sequence with the standard OSS Tauri
      # release pattern. Handles:
      #   - cross-platform tauri build (same `pnpm tauri build`)
      #   - macOS code signing (via APPLE_CERTIFICATE etc.)
      #   - Windows authenticode signing (via WINDOWS_CERTIFICATE etc.)
      #   - latest.json generation (auto-updater manifest)
      #   - GitHub Release creation as DRAFT — promote manually when ready
      # All env vars are silently ignored if their corresponding secret is
      # not set, so the action degrades gracefully on a fresh repo.
      - name: Build + sign + draft release (tauri-action)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing — REQUIRED for users to receive updates.
          # Generate with `pnpm tauri signer generate -- -w ~/.tauri/magpie-updater.key`,
          # then paste the printed PRIVATE key into Settings → Secrets as
          # TAURI_SIGNING_PRIVATE_KEY. The matching public key goes in
          # tauri.conf.json's plugins.updater.pubkey field.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Apple Developer signing + notarization. Skipped automatically
          # if APPLE_CERTIFICATE secret is not set.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows EV cert signing. Skipped automatically if not set.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: frontend
          # `__VERSION__` is replaced by tauri-action with the value from
          # tauri.conf.json. Each matrix job uploads to the SAME release
          # (deduplicated by tagName), so tagged tag-pushes get one release
          # with .dmg + .AppImage + .deb + .exe attached + latest.json.
          tagName: app-v__VERSION__
          releaseName: 'Magpie v__VERSION__'
          releaseDraft: true       # nothing publishes automatically
          prerelease: false
          includeUpdaterJson: true # generates latest.json for the updater

      # ── Always upload local artifacts (so devs can grab build outputs) ────
      # Independent of the release flow — uploads as workflow run artifacts
      # (90-day retention, accessible via the Actions UI). Useful even on
      # the release path because they include intermediate build state.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magpie-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
