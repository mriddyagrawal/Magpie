[project]
name = "magpie-cli"
version = "0.1.0"
description = "Interactive CLI for Magpie."
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "magpie",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
]

[project.scripts]
magpie-repl = "magpie_cli.repl:main"
# muscle-memory aliases from the Magpie era
ns = "magpie_cli.repl:main"
nas = "magpie_cli.repl:main"

[tool.uv.sources]
magpie = { workspace = true }

[build-system]
requires = ["setuptools>=77"]  # >=77 for the PEP 639 SPDX `license` field
build-backend = "setuptools.build_meta"
