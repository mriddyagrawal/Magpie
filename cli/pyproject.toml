[project]
name = "notspotlight"
version = "0.1.0"
description = "Interactive CLI for Magpie."
requires-python = ">=3.11"
dependencies = [
    "magpie",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
]

[project.scripts]
notspotlight = "notspotlight.repl:main"
ns = "notspotlight.repl:main"
nas = "notspotlight.repl:main"

[tool.uv.sources]
magpie = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
