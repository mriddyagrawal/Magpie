[project]
name = "notanotherspotlight"
version = "0.1.0"
description = "RAG-style semantic search over the local file system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.14",
    "pydantic>=2.8",
    "pypdf>=4.3",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "tqdm>=4.66",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "fastembed>=0.4",
    "colpali-engine>=0.3",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "python-pptx>=1.0",
    "trafilatura>=1.12",
    "mlx-vlm>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "ipykernel",
    "jupyter",
    "notebook",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "platformdirs>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = ["pytest>=8.0", "notspotlight"]

[tool.uv]
workspace = { members = ["cli"] }

[tool.uv.sources]
notspotlight = { workspace = true }
